<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PieFit</title>
<meta name="description" content="Rings, TRX and gym workout tracker">
<meta name="theme-color" content="#d9480f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PieFit">
<style>
:root{
  --bg:#f5f4f0; --card:#ffffff; --ink:#1c1c1a; --mute:#6f6e68; --line:#e3e1da; --soft:#fbe9e0;
  --accent:#d9480f; --accent-ink:#ffffff; --ok:#2f9e44; --fig:#1c1c1a; --bar:#b8b5aa;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141413; --card:#1f1f1d; --ink:#f1efe8; --mute:#a09e95; --line:#34332f; --soft:#3a2418;
    --accent:#ff8a4c; --accent-ink:#141413; --ok:#69db7c; --fig:#f1efe8; --bar:#6b695f;
  }
}
:root[data-theme="dark"]{
  --bg:#141413; --card:#1f1f1d; --ink:#f1efe8; --mute:#a09e95; --line:#34332f; --soft:#3a2418;
  --accent:#ff8a4c; --accent-ink:#141413; --ok:#69db7c; --fig:#f1efe8; --bar:#6b695f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Leelawadee UI",sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.nonav{padding-bottom:24px}
#app{max-width:520px;margin:0 auto;padding:16px 16px 8px}
h1{font-size:24px;margin:6px 0 4px;line-height:1.25} h2{font-size:18px;margin:20px 0 8px} h3{margin:0;font-size:17px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
small{color:var(--mute);font-size:13px}
a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 10px}
.card.hl{border-color:var(--accent);background:linear-gradient(0deg,var(--soft),var(--card))}
.card.hero{border:2px solid var(--accent)}
.card.warn{border-left:4px solid var(--accent);font-size:14px}
.card.sug .plan{font-size:22px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap;gap:6px}
.gap{gap:8px}.center{text-align:center}
.top{display:flex;align-items:center;margin-bottom:6px}
.lbl-sm{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
.chip{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute);background:transparent;white-space:nowrap}
.chip.p{border-color:var(--accent);color:var(--accent)}
button.chip{cursor:pointer;font-family:inherit;font-size:13px;min-height:32px}
button.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.mini{width:36px;height:36px;padding:0;display:inline-grid;place-items:center;flex:none}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);
  font:600 16px/1.2 inherit;font-family:inherit;cursor:pointer;min-height:50px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{font-size:14px;padding:10px;min-height:44px}
.btn.w-auto{width:auto;padding:14px 18px}
.btn:disabled{opacity:.4}
.btn.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));margin-top:8px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sess{cursor:pointer}.sess:active{transform:scale(.985)}
.emoji{font-size:24px;width:44px;height:44px;border-radius:12px;background:var(--bg);display:grid;place-items:center;flex:none}
.go{font-size:28px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .card{margin:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{display:flex;flex-direction:column;gap:6px}.tile b{line-height:1.25}
.stat{text-align:center;padding:12px 6px}.stat b{display:block;font-size:24px}
.item .num,.setrow .num{width:26px;height:26px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.inp{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:inherit;margin:0 0 8px;min-width:0}
select.inp{padding:10px 8px;font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:4;
  padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:8px 2px 10px;border:0;background:none;color:var(--mute);font:600 12px inherit;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1.2;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--accent)} nav button.on .ic{filter:none;opacity:1}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0 12px;background:var(--card)}
.seg button{flex:1;padding:11px 4px;border:0;background:transparent;color:var(--mute);font:600 14px inherit;font-family:inherit;cursor:pointer;min-height:44px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.track{height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.track.big{height:14px;margin:10px 0}
.fill{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}.fill.ok{background:var(--ok)}
.runbar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:10px;padding:8px 0;margin:-8px 0 4px}
.fig{background:var(--card);border:1px solid var(--line);border-radius:16px;display:block;width:100%;height:auto;max-height:30vh}
.fignote{font-size:12px;margin:4px 2px 10px}
.fig .bar,.fig .strap{stroke:var(--bar)} .fig .ring{fill:none;stroke:var(--accent);stroke-width:2.5}
.fig .limb{stroke:var(--fig);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig .torso{stroke:var(--accent);stroke-width:8;stroke-linecap:round}
.fig .head{fill:var(--fig)} .fig .ground{stroke:var(--line);stroke-width:2}
.fig .decr{fill:var(--line);stroke:var(--bar);stroke-width:1.5}.fig .decl{stroke:var(--bar);stroke-width:4;stroke-linecap:round}
.fig .pr-r{fill:var(--accent)}.fig .pr-b{fill:none;stroke:var(--accent);stroke-width:3}
details.how summary{cursor:pointer;font-weight:600;list-style:none}
details.how summary::after{content:' ▾';color:var(--mute)} details.how[open] summary::after{content:' ▴'}
.cues{margin:8px 0;padding-left:20px}.cues li{margin:4px 0}
.dots{display:flex;align-items:center;gap:8px;margin:0 0 6px}
.dot{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--mute)}
.dot.done{background:var(--ok);border-color:var(--ok);color:#fff}
.stepper{display:flex;align-items:center;justify-content:center;gap:16px;margin:2px 0 12px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:24px;cursor:pointer}
.stepper b{font-size:34px;min-width:90px;text-align:center}.stepper b.wv{font-size:22px;min-width:140px}
.tap{cursor:pointer;border-bottom:2px dashed var(--line)}
.sets{margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
.setrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border:0}
.bar-row{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.bar-row .lbl{width:92px;flex:none;line-height:1.2}.bar-row .track{flex:1}.bar-row .n{width:42px;text-align:right;color:var(--mute);flex:none}
.cust{display:block;margin:-6px 0 4px 100px}
.step{margin-top:12px}.step.locked{opacity:.55}.step a{color:inherit;font-weight:600}
.note{display:block;margin:8px 2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:6;overflow:auto;padding:4vh 12px}
.modal .sheet{background:var(--bg);max-width:480px;margin:0 auto;border-radius:20px;padding:16px}
.restm{display:grid;place-items:center}.restm .sheet{width:min(360px,92vw)}
.bigtime{display:block;font-size:64px;margin:6px 0 14px;font-variant-numeric:tabular-nums}
.tag{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--card);border:1px solid var(--line);color:var(--mute)}
.hero-top{text-align:center;padding:18px 0 8px}.logo{font-size:44px;color:var(--accent);line-height:1}
.vid{display:block;text-align:center;margin:14px 0}
.seg.scroll{overflow-x:auto;scrollbar-width:none}.seg.scroll::-webkit-scrollbar{display:none}.seg.scroll button{flex:0 0 auto;padding:11px 14px}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:0 0 10px}
.wd{background:var(--card);border:1px solid var(--line);border-radius:10px;text-align:center;padding:4px 0;opacity:.6}
.wd.on{opacity:1}.wd.done{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}.wd.done small{color:#fff}
.wd.today{outline:2px solid var(--accent)}.wd span{display:block;font-size:16px}
.item.pair{border-left:4px solid var(--accent)}.item.pa{margin-bottom:2px;border-bottom-left-radius:4px}.item.pb{border-top-left-radius:4px}
#chat{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.msg{padding:10px 12px;border-radius:14px;max-width:88%;font-size:15px;line-height:1.45}
.msg.user{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
textarea.inp{resize:vertical;min-height:48px}
.formm .sheet{max-width:560px}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;min-height:180px}
.stage video,.stage canvas{display:block;width:100%;height:auto;max-height:60vh;object-fit:contain}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hud{position:absolute;left:8px;top:8px;right:8px;display:flex;align-items:center;gap:10px;pointer-events:none}
.hud b{font-size:40px;color:#fff;text-shadow:0 2px 6px #000;font-variant-numeric:tabular-nums}
.hud small{color:#fff;text-shadow:0 1px 4px #000;font-size:15px}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.photos figure,.cmp figure,.sheet figure{margin:0}
.photos img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.photos figure.sel img{outline:3px solid var(--accent)}
figcaption{font-size:11px;color:var(--mute);text-align:center}
.sheet img{width:100%;border-radius:12px;display:block}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chart{width:100%;height:auto;display:block;margin:6px 0}
.chart .axis{stroke:var(--line);stroke-width:1}.chart .line{fill:none;stroke:var(--accent);stroke-width:2.5}
.chart .pt{fill:var(--accent)}.chart .lab{fill:var(--mute);font-size:10px}
label.row{gap:8px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:12px;z-index:9;font-size:14px;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<script src="native.js"></script>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="i18n-trainer.js"></script>
<script src="sound.js"></script>
<script src="coach.js"></script>
<script src="body.js"></script>
<script src="form.js"></script>
<script src="yoga.js"></script>
<script src="app.js"></script>
</body>
</html>
